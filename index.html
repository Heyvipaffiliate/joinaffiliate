  <title>HeyVIP Affiliate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      background: #070b14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }
    /* ===== MOVING THEME BACKGROUND ===== */
    .moving-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: #070b14;
      overflow: hidden;
    }
    .moving-bg::before,
    .moving-bg::after {
      content: "";
      position: absolute;
      width: 160%;
      height: 160%;
      top: -30%;
      left: -30%;
      background:
        radial-gradient(circle at 15% 25%, rgba(139, 92, 246, 0.55) 0%, transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(14, 165, 233, 0.45) 0%, transparent 40%),
        radial-gradient(circle at 70% 75%, rgba(236, 72, 153, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 25% 80%, rgba(34, 211, 238, 0.40) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.18) 0%, transparent 50%);
      animation: moveLights 16s ease-in-out infinite alternate;
    }
    .moving-bg::after {
      background:
        radial-gradient(circle at 75% 35%, rgba(168, 85, 247, 0.40) 0%, transparent 38%),
        radial-gradient(circle at 30% 55%, rgba(59, 130, 246, 0.35) 0%, transparent 42%),
        radial-gradient(circle at 55% 20%, rgba(244, 114, 182, 0.28) 0%, transparent 40%);
      animation: moveLights2 20s ease-in-out infinite alternate;
    }
    @keyframes moveLights {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(5%, -4%) scale(1.08) rotate(2deg); }
      100% { transform: translate(-4%, 5%) scale(1) rotate(-1deg); }
    }
    @keyframes moveLights2 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(-6%, 4%) scale(1.1) rotate(-2deg); }
      100% { transform: translate(4%, -3%) scale(1) rotate(1deg); }
    }
    /* ===== MAIN WRAPPER ===== */
    .affiliate-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
      position: relative;
      z-index: 1;
    }
    /* ===== SLIDER ===== */
    .affiliate-slider {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.5);
      cursor: pointer;
      background: rgba(10, 15, 26, 0.55);
      border: 1px solid rgba(255,215,0,0.18);
      backdrop-filter: blur(4px);
    }
    .affiliate-slides {
      display: flex;
      transition: transform 0.7s ease-in-out;
    }
    .affiliate-slide {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .affiliate-slide img {
      width: 100%;
      height: auto;
      max-height: 340px;
      object-fit: contain;
      display: block;
    }
    .affiliate-slider-dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .affiliate-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .affiliate-dot.affiliate-active {
      background: #ffd700;
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(255,215,0,0.7);
    }
    /* ===== TITLE ===== */
    .affiliate-section-title {
      text-align: center;
      margin: 14px 0 8px;
      font-size: 22px;
      font-weight: 700;
      color: #ffd700;
      line-height: 1.4;
      text-shadow: 0 0 14px rgba(255,215,0,0.3);
    }
    .affiliate-section-subtitle {
      text-align: center;
      margin-bottom: 32px;
      font-size: 15px;
      color: #a0aec0;
    }
    /* ===== PROJECT GRID ===== */
    .affiliate-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 42px;
    }
    .affiliate-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,215,0,0.18);
      border-radius: 18px;
      padding: 26px 18px 22px;
      text-align: center;
      transition: all 0.35s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .affiliate-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,215,0,0.5);
      box-shadow: 0 14px 32px rgba(255,215,0,0.15), 0 6px 20px rgba(0,0,0,0.4);
      background: rgba(255,255,255,0.07);
    }
    /* ===== LOGO BOX ===== */
    .affiliate-card-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      width: 140px;
      height: 140px;
      border-radius: 18px;
      padding: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,215,0,0.25);
    }
    .logo-betjili   { background: #0a0a0a; }
    .logo-mostplay  { background: #0c2d6b; }
    .logo-sbj66     { background: #0a2e1a; }
    .logo-darazplay { background: #2a1208; }
    .logo-betjdb    { background: #111827; }
    .logo-betvisa   { background: #0a1a3a; }
    .logo-jeetway   { background: #1a0a2e; }

    .affiliate-card:hover .affiliate-card-logo-link {
      border-color: rgba(255,215,0,0.55);
      box-shadow: 0 0 20px rgba(255,215,0,0.22);
      transform: scale(1.03);
    }
    .affiliate-card-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .affiliate-support-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      color: #29b6f6;
      font-size: 14px;
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .affiliate-support-link:hover { color: #4fc3f7; }
    .affiliate-support-link svg { width: 16px; height: 16px; }
    .affiliate-card-desc {
      font-size: 14.5px;
      color: #cbd5e0;
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 52px;
    }
    .affiliate-btn-signup {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #f6c90e, #e6a800);
      color: #111;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(246,201,14,0.3);
    }
    .affiliate-btn-signup:hover {
      background: linear-gradient(135deg, #ffd84d, #f6c90e);
      box-shadow: 0 6px 20px rgba(246,201,14,0.45);
      transform: translateY(-2px);
    }
    /* ===== LOGO SLIDER ===== */
    .affiliate-logo-slider {
      margin: 38px 0 22px;
      overflow: hidden;
      background: rgba(0,0,0,0.35);
      border-radius: 16px;
      padding: 18px 0;
      border: 1px solid rgba(255,215,0,0.14);
    }
    .affiliate-logo-track {
      display: flex;
      gap: 40px;
      animation: affiliate-scroll 28s linear infinite;
      width: max-content;
    }
    .affiliate-logo-item {
      height: 52px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
      filter: brightness(0.95);
      transition: filter 0.3s ease;
    }
    .affiliate-logo-item:hover { filter: brightness(1.15); }
    @keyframes affiliate-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ===== SIDE BY SIDE: VIDEO + FOLLOW ===== */
    .bottom-section {
      display: flex;
      gap: 30px;
      margin: 32px 0 40px;
      align-items: center;
    }
    .premium-video-section {
      flex: 1.5;
      text-align: center;
    }
    .premium-video-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(255,215,0,0.35);
    }
    .premium-video-subtitle {
      font-size: 13px;
      color: #a0aec0;
      margin-bottom: 12px;
    }
    .premium-video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 215, 0, 0.35);
      box-shadow: 
        0 0 0 1px rgba(255,215,0,0.1),
        0 12px 40px rgba(0,0,0,0.55),
        0 0 30px rgba(255,215,0,0.12);
      background: #000;
      transition: all 0.4s ease;
    }
    .premium-video-wrapper:hover {
      border-color: rgba(255, 215, 0, 0.55);
      box-shadow: 
        0 0 0 1px rgba(255,215,0,0.18),
        0 16px 48px rgba(0,0,0,0.6),
        0 0 40px rgba(255,215,0,0.2);
      transform: translateY(-3px);
    }
    .premium-video-wrapper video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #000;
    }

    /* FOLLOW SECTION - No box, clean */
    .follow-section {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .follow-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.3);
    }
    .follow-icons {
      display: flex;
      gap: 28px;
      align-items: center;
    }
    .follow-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .follow-item:hover {
      transform: translateY(-4px);
    }
    .follow-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255,255,255,0.25);
      transition: all 0.3s ease;
    }
    .follow-item:hover .follow-icon {
      border-color: rgba(255,215,0,0.5);
      box-shadow: 0 0 18px rgba(255,215,0,0.2);
    }
    .follow-icon.telegram {
      background: rgba(0, 136, 204, 0.15);
    }
    .follow-icon.facebook {
      background: rgba(24, 119, 242, 0.15);
    }
    .follow-icon svg {
      width: 30px;
      height: 30px;
    }
    .follow-label {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    /* ===== FLOATING SUPPORT ===== */
    .floating-support {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .floating-support:hover {
      transform: translateY(-4px) scale(1.05);
    }
    .floating-support-icon-wrap {
      position: relative;
      width: 58px;
      height: 58px;
      background: linear-gradient(145deg, #0088cc, #00aaff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,136,204,0.45);
      border: 2px solid rgba(255,255,255,0.2);
    }
    .floating-support-icon-wrap svg.telegram {
      width: 30px;
      height: 30px;
      color: #fff;
    }
    .floating-mic {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: #ffd700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 1.5px solid #111;
    }
    .floating-mic svg {
      width: 12px;
      height: 12px;
      color: #111;
    }
    .floating-support-text {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #ffd700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      background: rgba(0,0,0,0.55);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    /* ===== FOOTER ===== */
    .affiliate-footer {
      text-align: center;
      margin-top: 32px;
      padding: 18px 10px;
      font-size: 13.5px;
      color: #718096;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    /* ===== MOBILE ===== */
    @media screen and (max-width: 900px) {
      .bottom-section {
        flex-direction: column;
        gap: 30px;
      }
      .premium-video-section,
      .follow-section {
        flex: none;
        width: 100%;
      }
    }
    @media screen and (max-width: 768px) {
      .affiliate-grid {
        grid-template-columns: 1fr !important;
      }
      .affiliate-card-logo-link {
        width: 150px !important;
        height: 150px !important;
      }
      .affiliate-section-title {
        font-size: 19px !important;
      }
      .affiliate-slide img {
        max-height: 200px !important;
      }
      .premium-video-title { font-size: 17px !important; }
      .premium-video-subtitle { font-size: 13px !important; }
      .premium-video-wrapper { border-radius: 14px; }
      .floating-support {
        bottom: 18px;
        right: 16px;
      }
      .floating-support-icon-wrap {
        width: 52px;
        height: 52px;
      }
      .floating-support-icon-wrap svg.telegram {
        width: 26px;
        height: 26px;
      }
      .floating-mic {
        width: 20px;
        height: 20px;
      }
      .floating-support-text {
        font-size: 11px;
      }
    }
  </style>
</head>
